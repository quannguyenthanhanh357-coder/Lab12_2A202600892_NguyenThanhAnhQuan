services:
  - type: web
    name: movie-react-agent
    runtime: docker
    region: singapore
    plan: starter
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: gpt-4o-mini
      - key: LOG_LEVEL
        value: INFO
